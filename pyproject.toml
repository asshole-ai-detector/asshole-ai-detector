[project]
name = "asshole-ai-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark1q", email = "mark.eduard7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
asshole-ai-detector = "asshole_ai_detector:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.2.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
index = [
    "chromadb>=1.5.9,<2",
]
rag = [
    "sentence-transformers>=6.3.0",
]
ui = [
    "streamlit>=1.67.0",
]
